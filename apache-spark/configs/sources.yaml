# Logical data sources. Each Home Credit file is owned by exactly one simulated business system.
# origin: ORIGINAL = Kaggle Home Credit file (historical); SYNTHETIC = generated by this project.
sources:
  loan_application_system:
    title: Loan Application System
    origin: ORIGINAL
    frequency: event-driven (one event per submitted application)
    tables: [application_train, application_test]
    topic: loan_application_events
    event_type: LOAN_APPLICATION_SUBMITTED
    module: ingestion.application_source

  external_credit_bureau:
    title: External Credit Bureau
    origin: ORIGINAL
    frequency: on request (credit report) + monthly status snapshots
    tables: [bureau, bureau_balance]
    topic: credit_bureau_events
    event_type: CREDIT_BUREAU_RECORD
    module: ingestion.bureau_source

  previous_loan_system:
    title: Previous Loan System (Home Credit history)
    origin: ORIGINAL
    frequency: event-driven (decision on each historical application)
    tables: [previous_application]
    topic: previous_loan_events
    event_type: PREVIOUS_APPLICATION_DECIDED
    module: ingestion.previous_loan_source

  installment_payment_system:
    title: Installment Payment System
    origin: ORIGINAL
    frequency: per installment period (due date / payment date)
    tables: [installments_payments]
    topic: installment_payment_events
    event_type: INSTALLMENT_PAYMENT
    module: ingestion.installment_source

  pos_cash_system:
    title: POS / Cash Loan System
    origin: ORIGINAL
    frequency: monthly balance snapshot
    tables: [POS_CASH_balance]
    topic: pos_cash_events
    event_type: POS_CASH_MONTHLY_BALANCE
    module: ingestion.pos_cash_source

  credit_card_system:
    title: Credit Card System
    origin: ORIGINAL
    frequency: monthly statement
    tables: [credit_card_balance]
    topic: credit_card_events
    event_type: CREDIT_CARD_MONTHLY_STATEMENT
    module: ingestion.credit_card_source

  synthetic_customer_behavior:
    title: Synthetic Customer Behaviour (traffic records) - SYNTHETIC, NOT REAL
    origin: SYNTHETIC
    frequency: periodic refresh (DATA_UPDATED_AT)
    tables: [synthetic_traffic_profile]
    topic: synthetic_customer_events
    event_type: SYNTHETIC_TRAFFIC_PROFILE_UPDATED
    module: ingestion.synthetic_source

# Files that are part of the Kaggle package but are not business sources
reference_files:
  HomeCredit_columns_description.csv: data dictionary (used by profiling)
  sample_submission.csv: Kaggle submission template (not ingested as business data)
