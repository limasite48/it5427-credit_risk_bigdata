[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-intelligence"
version = "0.1.0"
description = "Multi-Source Big Data for Credit Risk Assessment and Prediction (IT5427 Big Data)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "IT5427 Big Data Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
credit-score = "src.integration.kafka_consumer_scorer:main"
credit-eval = "evaluate_profile:main"
credit-train = "run_track_a:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.*"]
