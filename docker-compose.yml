services:
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      MODEL_PATH: /app/outputs/models/credit_risk_model.joblib
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    # Intentionally no ports: section — internal only.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATA_DIR: /app/outputs
      MODEL_PATH: /app/outputs/models/credit_risk_model.joblib
      SCORED_CSV: /app/outputs/scored_applications_sample.csv
      RISK_SUMMARY: /app/outputs/metrics/risk_summary.json
      DEMOGRAPHICS: /app/outputs/metrics/demographic_profiles.json
      ROC_CURVE: /app/outputs/figures/roc_curve.png
      MODEL_EVALUATION: /app/outputs/metrics/model_evaluation.json
      SUPPLEMENTARY_DIR: /app/supplementary
      SPARK_REPORTS_DIR: /app/spark-reports
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_ANALYST_USERNAME: ${DEMO_ANALYST_USERNAME}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD}
      DEMO_UNDERWRITER_USERNAME: ${DEMO_UNDERWRITER_USERNAME}
      DEMO_UNDERWRITER_PASSWORD: ${DEMO_UNDERWRITER_PASSWORD}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-60}
      SCORE_RATE_LIMIT: ${SCORE_RATE_LIMIT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      ml-service:
        condition: service_healthy
    networks:
      - internal
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
